name: Style Our Network Heading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-network-section.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  style-network-heading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Youth Connect brand gradient
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'id="network"' not in s:
              raise SystemExit('Our Network section missing')
          css='.network-head h2{background:linear-gradient(90deg,var(--green),var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}'
          if '-webkit-text-fill-color:transparent' not in s:
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit gradient heading
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Style Our Network heading with brand gradient"
          git push

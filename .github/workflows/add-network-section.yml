name: Refine Homepage Network Section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-network-section.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine homepage flow and flags
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Replace the About CTA with two clear section shortcuts.
          s=re.sub(r'<a[^>]+href="#program"[^>]*>\s*Learn More About Us\s*→?\s*</a>',
                   '<div class="about-actions"><a href="#what-we-do" class="btn blue">What We Do</a><a href="#network" class="btn about-network-btn">Our Network</a></div>',s,flags=re.I)
          s=s.replace('Learn More About Us →','What We Do')

          # Make the existing What We Do section directly addressable without changing its design.
          if 'id="what-we-do"' not in s:
              # Prefer the section containing the visible What We Do heading.
              pos=s.find('What We Do')
              if pos!=-1:
                  start=s.rfind('<section',0,pos)
                  end=s.find('>',start)
                  if start!=-1 and end!=-1 and ' id=' not in s[start:end]:
                      s=s[:end]+' id="what-we-do"'+s[end:]

          extra='''.about-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.about-network-btn{background:#fff;color:#0654d9;border:1px solid rgba(18,104,255,.22);box-shadow:none}.about-network-btn:hover{background:#f3f7ff}.network-section{padding:12px 0 72px;background:#fff}.network-head{text-align:center;max-width:760px;margin:0 auto 28px}.network-head h2{font-size:clamp(30px,3vw,42px);letter-spacing:-.04em;margin-bottom:10px}.network-head p{color:var(--muted);line-height:1.7}.network-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.network-card{position:relative;padding:24px;border-radius:22px;background:#fff;border:1px solid rgba(10,26,52,.08);box-shadow:0 14px 38px rgba(13,33,62,.07);display:flex;flex-direction:column;min-height:255px}.network-card.primary{border-color:rgba(18,104,255,.24);box-shadow:0 16px 42px rgba(18,104,255,.10)}.network-country{display:flex;align-items:center;gap:10px;color:#0654d9;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}.network-flag{width:30px;height:20px;border-radius:3px;object-fit:cover;box-shadow:0 0 0 1px rgba(10,26,52,.12)}.network-card h3{font-size:20px;margin-bottom:10px}.network-card p{font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:14px}.network-reg{font-size:12px;font-weight:800;color:#233b59;margin-top:auto}.network-link{display:inline-flex;align-items:center;gap:7px;margin-top:13px;color:#0654d9;font-size:12px;font-weight:900}.network-link:hover{color:#0b7adf}@media(max-width:900px){.network-grid{grid-template-columns:1fr}.network-card{min-height:0}}'''
          # Remove previous network CSS and insert refined CSS once.
          s=re.sub(r'\.network-section\{padding:12px 0 72px.*?@media\(max-width:900px\)\{\.network-grid\{grid-template-columns:1fr\}\.network-card\{min-height:0\}\}', '', s, flags=re.S)
          if '.about-actions{' not in s:
              s=s.replace('</style>',extra+'</style>',1)

          # Reliable image flags (emoji rendering differs by OS/browser).
          s=s.replace('<span class="network-flag">🇧🇩</span>Bangladesh','<img class="network-flag" src="https://flagcdn.com/w40/bd.png" alt="Bangladesh flag">Bangladesh')
          s=s.replace('<span class="network-flag">🇲🇾</span>Malaysia','<img class="network-flag" src="https://flagcdn.com/w40/my.png" alt="Malaysia flag">Malaysia')

          # Ensure the visible section order is About -> What We Do -> Our Network.
          net=re.search(r'<section class="network-section" id="network">.*?</section>',s,re.S)
          if net:
              network=net.group(0)
              s=s[:net.start()]+s[net.end():]
              # Put network immediately after the What We Do section.
              wpos=s.find('id="what-we-do"')
              if wpos!=-1:
                  sec_start=s.rfind('<section',0,wpos)
                  sec_end=s.find('</section>',wpos)
                  if sec_start!=-1 and sec_end!=-1:
                      sec_end+=len('</section>')
                      s=s[:sec_end]+network+s[sec_end:]

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit refined homepage
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine homepage section flow and network flags"
          git push

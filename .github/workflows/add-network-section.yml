name: Restore Our Network Section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-network-section.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore network section and anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Standard section spacing: match the main site rhythm.
          s=re.sub(r'\.network-section\{padding:[^;]+;background:#fff', '.network-section{padding:78px 0;background:#fff', s, count=1)
          if '@media(max-width:680px){.network-section' not in s:
              s=s.replace('</style>','@media(max-width:680px){.network-section{padding:52px 0}}</style>',1)

          # Preserve anchors and section content if already present.
          if 'id="network"' not in s:
              raise SystemExit('Our Network section missing')
          if 'href="#network"' not in s:
              raise SystemExit('Our Network button missing')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit standardized spacing
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Standardize Our Network section spacing"
          git push

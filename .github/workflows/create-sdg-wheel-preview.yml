name: Create SDG Wheel Preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/create-sdg-wheel-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build preview-only homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('index.html').read_text(encoding='utf-8')
          css='''
          /* Preview only: subtle continuous SDG wheel rotation */
          .message-icon img{animation:sdgWheelSpin 26s linear infinite;transform-origin:50% 50%;will-change:transform}
          .message-icon:hover img{animation-play-state:paused}
          @keyframes sdgWheelSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
          @media (prefers-reduced-motion:reduce){.message-icon img{animation:none}}
          '''
          src=src.replace('</style>',css+'</style>',1)
          src=src.replace('<title>Youth Connect Foundation | Youth-Led Nonprofit for SDGs</title>','<title>SDG Wheel Animation Preview | Youth Connect Foundation</title>',1)
          Path('sdg-wheel-preview.html').write_text(src,encoding='utf-8')
          PY
      - name: Validate preview isolation
        run: |
          grep -q 'sdgWheelSpin' sdg-wheel-preview.html
          grep -q '26s linear infinite' sdg-wheel-preview.html
          ! grep -q 'sdg-wheel-preview.html' .cpanel.yml
      - name: Commit preview only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sdg-wheel-preview.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add preview-only rotating SDG wheel homepage'
            git push
          fi
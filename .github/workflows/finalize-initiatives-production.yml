name: Finalize Initiatives Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-initiatives-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove preview wording and finalize production copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [Path('initiatives.html'), Path('initiatives/index.html')]
          preview_text = ('This preview keeps each initiative short and easy to scan. If approved, '
                          'selected flagship initiatives can later have dedicated detail pages with photos, '
                          'outcomes, partners and impact stories—without making the main page cluttered.')

          for p in files:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              s = s.replace('Preview of Youth Connect Foundation initiatives across education, skills, innovation, health and climate action.',
                            'Explore Youth Connect Foundation initiatives across education, skills, innovation, health and climate action.')
              s = s.replace(preview_text, '')
              s = re.sub(r'<p[^>]*>\s*This preview keeps each initiative short and easy to scan\..*?main page cluttered\.\s*</p>', '', s, flags=re.I|re.S)
              s = re.sub(r'<div[^>]*class=["\'][^"\']*preview-note[^"\']*["\'][^>]*>.*?</div>', '', s, flags=re.I|re.S)
              s = s.replace('Preview only — not linked to the live website navigation', '')
              s = re.sub(r'\s{3,}', '  ', s)
              p.write_text(s, encoding='utf-8')

          # Ensure cPanel deploy includes both canonical source and clean route folder.
          cp = Path('.cpanel.yml')
          if cp.exists():
              s = cp.read_text(encoding='utf-8')
              lines = s.splitlines()
              additions = [
                  '    - /bin/cp initiatives.html $DEPLOYPATH',
                  '    - /bin/cp -R initiatives $DEPLOYPATH',
              ]
              for a in additions:
                  if a not in lines:
                      lines.insert(-1 if lines else 0, a)
              cp.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Validate production page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for f in ['initiatives.html','initiatives/index.html']:
              s=Path(f).read_text(encoding='utf-8')
              assert 'This preview keeps each initiative short and easy to scan' not in s
              assert 'Preview only' not in s
              assert 'Initiatives' in s
              assert 'Opening pathways for girls in technology' in s
              assert 'Community impact beyond the classroom' in s
              assert 'gradient-heading' in s
          cp=Path('.cpanel.yml').read_text(encoding='utf-8')
          assert '/bin/cp initiatives.html $DEPLOYPATH' in cp
          assert '/bin/cp -R initiatives $DEPLOYPATH' in cp
          PY

      - name: Commit production-ready Initiatives page
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add initiatives.html initiatives/index.html .cpanel.yml
          git commit -m "Finalize Initiatives page for production"
          git push

name: Refine Initiatives Preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refine-initiatives-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine preview navigation and SDG badges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('initiatives-preview.html')
          s=p.read_text(encoding='utf-8')

          # Remove generic topic tags from every initiative card.
          s=re.sub(r'<div class="tag-row">.*?</div>', '', s, flags=re.S)

          # Smart, easy-to-scan focus navigation.
          s=re.sub(r'<div class="category-tabs explore-tabs">.*?</div>', '''<div class="category-tabs explore-tabs">
          <a href="#education"><span class="focus-icon"><i class="fa-solid fa-graduation-cap"></i></span><span>Education & Skills</span><i class="fa-solid fa-arrow-down focus-arrow"></i></a>
          <a href="#innovation"><span class="focus-icon"><i class="fa-solid fa-microchip"></i></span><span>Innovation & Technology</span><i class="fa-solid fa-arrow-down focus-arrow"></i></a>
          <a href="#career"><span class="focus-icon"><i class="fa-solid fa-briefcase"></i></span><span>Career & Exposure</span><i class="fa-solid fa-arrow-down focus-arrow"></i></a>
          <a href="#girls"><span class="focus-icon"><i class="fa-solid fa-venus"></i></span><span>Girls & Inclusion</span><i class="fa-solid fa-arrow-down focus-arrow"></i></a>
          <a href="#community"><span class="focus-icon"><i class="fa-solid fa-heart-pulse"></i></span><span>Health & Climate</span><i class="fa-solid fa-arrow-down focus-arrow"></i></a>
          </div>''',s,count=1,flags=re.S)

          # Upgrade SDG badges with goal-specific icons.
          icon_map={
              '3':'fa-heart-pulse','4':'fa-graduation-cap','5':'fa-venus','8':'fa-briefcase',
              '9':'fa-microchip','13':'fa-leaf','17':'fa-handshake'
          }
          def badge(m):
              n=m.group(1)
              attrs=m.group(2) or ''
              icon=icon_map.get(n,'fa-bullseye')
              return f'<span class="sdg-badge sdg-{n}"{attrs}><i class="fa-solid {icon}"></i><span>SDG {n}</span></span>'
          s=re.sub(r'<span class="sdg-badge sdg-(3|4|5|8|9|13|17)"([^>]*)>SDG \1</span>',badge,s)

          css='''.category-tabs.explore-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:1100px;margin:0 auto}.category-tabs.explore-tabs a{min-height:94px;padding:14px 12px;border-radius:20px;background:linear-gradient(180deg,#fff,#f7fbff);border:1px solid rgba(18,104,255,.14);box-shadow:0 10px 28px rgba(13,33,62,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#183354;text-align:center;transition:.22s}.category-tabs.explore-tabs a:hover{transform:translateY(-3px);border-color:rgba(18,104,255,.34);box-shadow:0 16px 34px rgba(13,33,62,.11)}.focus-icon{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#eef5ff,#effff4);color:#1268ff;font-size:17px}.focus-arrow{font-size:9px;color:#8aa1bb}.category-tabs.explore-tabs a>span:nth-child(2){font-size:11px;font-weight:900;line-height:1.25}.sdg-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:18px}.sdg-badge{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 7px;border-radius:9px;color:#fff;font-size:10px;font-weight:900;box-shadow:0 4px 10px rgba(13,33,62,.10)}.sdg-badge i{width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:9px}.sdg-badge span{font-size:10px;font-weight:900}.tag-row,.tag{display:none!important}@media(max-width:900px){.category-tabs.explore-tabs{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.category-tabs.explore-tabs{grid-template-columns:1fr 1fr;gap:9px}.category-tabs.explore-tabs a{min-height:84px;padding:11px 8px}.category-tabs.explore-tabs a:last-child{grid-column:1/-1;max-width:50%;width:100%;justify-self:center}}'''
          if '.focus-icon{' not in s:
              s=s.replace('</style>',css+'</style>',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit preview refinement
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add initiatives-preview.html
          git commit -m "Refine initiatives navigation and SDG badges"
          git push
